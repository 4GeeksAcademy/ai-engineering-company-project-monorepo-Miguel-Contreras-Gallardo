# MVP App — Docker Compose
# Orquesta: PostgreSQL + FastAPI + Next.js

name: mvp-app

services:
  # ── Base de datos ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: mvp-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mvp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mvp}
      POSTGRES_DB: ${POSTGRES_DB:-mvp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mvp} -d ${POSTGRES_DB:-mvp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mvp-net

  # ── Backend FastAPI ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
    container_name: mvp-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mvp}:${POSTGRES_PASSWORD:-mvp}@db:5432/${POSTGRES_DB:-mvp}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mvp-net

  # ── Frontend Next.js ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
    container_name: mvp-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      - backend
    networks:
      - mvp-net

volumes:
  pgdata:

networks:
  mvp-net:
    name: mvp-net
    driver: bridge