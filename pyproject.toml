[project]
name = "trackflow"
version = "0.1.0"
description = "TrackFlow AI Platform — Automatización e IA para logística de última milla"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "prefect>=3",
    "pydantic>=2",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
forecasting = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = []
