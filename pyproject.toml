[project]
name = "trackflow"
version = "0.1.0"
description = "TrackFlow AI Platform — Automatización e IA para logística de última milla"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.150.0",
    "httpx>=0.27",
    "openai>=3.60.0",
    "prefect>=3",
    "pydantic>=2",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
forecasting = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
